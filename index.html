function norm(d){d=d||{};['st','tps','as','fu','au','kk'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=[]});['sc','pb'].forEach(k=>{if(!d[k]||typeof d[k]!='object')d[k]={}});if(!Array.isArray(d.mp)||!d.mp.length)d.mp=DEF_MAPEL.slice();d.cfg=Object.assign({f:30,s:70,cap:false},d.cfg||{});return d}

function applyOp(db,o){switch(o.k){
case'rec':{const L=db[o.c],i=L.findIndex(x=>x.id==o.r.id);if(i<0)L.push(o.r);else L[i]=o.r;break}
case'del':db[o.c]=db[o.c].filter(x=>x.id!=o.id);if(o.c=='as'){delete db.sc[o.id];delete db.pb[o.id];db.fu=db.fu.filter(f=>f.aid!=o.id)}

case'sc':{const m=db[o.c];if(o.v==null){if(m[o.a]&&m[o.a][o.s])delete m[o.a][o.s][o.t]}else{m[o.a]=m[o.a]||{};m[o.a][o.s]=m[o.a][o.s]||{};m[o.a][o.s][o.t]=o.v}break}

const applyOps=(d,ops)=>ops.forEach(o=>applyOp(d,o));
function diff(b,d){const o=[];
['st','tps','as','fu','kk'].forEach(c=>{const bm=new Map(b[c].map(x=>[x.id,JSON.stringify(x)])),seen=new Set();d[c].forEach(x=>{seen.add(x.id);if(bm.get(x.id)!==JSON.stringify(x))o.push({k:'rec',c,r:x})});b[c].forEach(x=>{if(!seen.has(x.id))o.push({k:'del',c,id:x.id})})});
['sc','pb'].forEach(c=>{const B=b[c]||{},D=d[c]||{};
Object.keys(D).forEach(a=>Object.keys(D[a]).forEach(s=>Object.keys(D[a][s]).forEach(t=>{const v=D[a][s][t];if(!(B[a]&&B[a][s]&&B[a][s][t]===v))o.push({k:'sc',c,a,s,t,v})})));

async function api(b,u){const r=await fetch(u||URLS,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)});const t=await r.text();try{return JSON.parse(t)}catch(e){throw new Error('Server membalas bukan JSON (HTTP '+r.status+'): '+t.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,160))}}

const snap=JSON.stringify(db),ops=diff(base,db);if(!ops.length){sv('✓ Tersimpan di Google Sheets');return}

if(r.error){sv('Gagal');toast(r.error);if(/password|Username|dinonaktifkan/i.test(r.error)){alert('Sesi berakhir: '+r.error);location.reload();return}}

if(r.db){const kp=db.kk,s=norm(r.db);base=clone(s);db=clone(s);applyOps(db,local);if(!kkOK)db.kk=kp;stale=true}else base=JSON.parse(snap);

if(r.db&&!editing()){stale=false;render()}}}
catch(e){sv('Gagal menyimpan — akan dicoba lagi');clearTimeout(sT);sT=setTimeout(flush,8000)}
busy=false;if(dirty)flush()}
const save=()=>{if(role=='Kepala Sekolah')return;sv('Menyimpan…');clearTimeout(sT);sT=setTimeout(flush,900)},uid=p=>p+Date.now().toString(36)+Math.floor(Math.random()*999);

if(r.error){if(/password|Username|dinonaktifkan/i.test(r.error)){online=false;alert('Sesi berakhir: '+r.error);location.reload()}return}

function rebase(r){const local=diff(base,db),kp=db.kk,s=norm(r.db);base=clone(s);db=clone(s);applyOps(db,local);if(!kkOK)db.kk=kp;rev=r.rev}

/* ---------- Hak akses di sisi tampilan (server memeriksa ulang setiap perubahan) ---------- */

const inScope=(k,m)=>adm()||(gur()&&ME.kelas.includes(k)&&ME.mapel.includes(m));

const tp=id=>db.tps.find(x=>x.id==id)||{kode:'?',teks:''},curA=(l=db.as)=>l.find(a=>a.id==cur)||l[0],curIn=()=>curA(mine()),sk=(a,sid,t)=>(db.sc[a.id]||{})[sid]?.[t],pbv=(a,sid,t)=>(db.pb[a.id]||{})[sid]?.[t];

function an(a){const ss=db.st.filter(s=>s.kelas==a.kelas);
